[workspace.package]
authors = ["EoTLabs <info@eotlabs.io>"]
edition = "2021"
version = "0.2.1"
description = "peaq storage pallet and rpc interface."
homepage = "https://peaq.network/"
license = "Apache-2.0"
publish = false
repository = "https://github.com/peaqnetwork/peaq-pallet-storage/"

[workspace.dependencies]
hex-literal = "0.3.3"

parity-scale-codec = { version = "3.6.12", default-features = false }
frame-support = { version = "40.1.0", default-features = false }
frame-system = { version = "40.1.0", default-features = false }
scale-info = { default-features = false, version = "2.0.1" }
sp-runtime = { version = "41.1.0", default-features = false }
sp-core = { version = "36.1.0", default-features = false }
sp-io = { version = "40.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
frame-benchmarking = { version = "40.0.0", default-features = false }
sp-api = { version = "36.0.1", default-features = false }
sp-blockchain = { version = "39.0.0", default-features = false }
sp-rpc = { version = "34.0.0", default-features = false }
pallet-balances = { version = "41.1.0", default-features = false }

serde = "1.0.136"
jsonrpsee = { version = "0.20.3" }

serde_json = "1.0"

[workspace]
members = [
	"pallet",
    "rpc",
	"rpc/runtime-api",
]
resolver = "2"


